<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aentigo Reputation</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: linear-gradient(180deg, #071b42 0%, #050914 100%);
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
}

.container {
  width: 100%;
  max-width: 420px;
  padding: 24px;
}

.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 32px 24px;
}

.username {
  font-size: 28px;
  font-weight: 900;
  color: #22D3EE;
  margin-bottom: 20px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 24px;
}

.stat {
  background: rgba(255,255,255,0.08);
  padding: 10px 16px;
  border-radius: 999px;
  font-weight: 700;
}

.text {
  color: rgba(255,255,255,0.75);
  line-height: 1.6;
  margin-bottom: 24px;
}

.button {
  display: inline-block;
  background: #22D3EE;
  color: #071b42;
  text-decoration: none;
  padding: 14px 24px;
  border-radius: 18px;
  font-weight: 900;
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  opacity: 0.5;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="username" id="username">
      @username
    </div>

    <div class="stats">
      <div class="stat">⭐ 5.0</div>
      <div class="stat">💬 0 Reviews</div>
    </div>

    <div class="text">
      View this reputation profile in the Aentigo app.
    </div>

    <a href="https://aentigo.com" class="button">
      Open Aentigo
    </a>

  </div>

  <div class="footer">
    © 2026 Aentigo. All rights reserved.
  </div>
</div>

<script>
const parts = window.location.pathname.split('/');
const user = parts[parts.length - 1];

if (user && user !== 'index.html') {
  document.getElementById('username').innerText =
    '@' + user.replace('@', '');
}
</script>

</body>
</html>
