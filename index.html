<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aentigo</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
background:linear-gradient(180deg,#071b42 0%,#0b1026 100%);
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.container{
max-width:800px;
padding:30px;
}

.logo{
width:240px;
max-width:80%;
margin-bottom:30px;
}

h1{
font-size:64px;
font-weight:800;
margin-bottom:15px;
}

p{
font-size:22px;
opacity:.85;
margin-bottom:12px;
}

.button{
display:inline-block;
margin-top:25px;
padding:14px 32px;
background:white;
color:#071b42;
text-decoration:none;
font-weight:bold;
border-radius:12px;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo" alt="Aentigo Logo">

<h1>Aentigo</h1>

<p>Fast connections between people and opportunities.</p>

<p>Coming Soon on iOS & Android</p>

<a href="#" class="button">Coming Soon</a>

</div>

</body>
</html>
