<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aentigo</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:linear-gradient(180deg,#071b42 0%,#050914 100%);
  color:white;
  font-family:Arial, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  padding:30px;
}

.logo{
  width:220px;
  max-width:80%;
  margin-bottom:28px;
}

h1{
  font-size:58px;
  font-weight:800;
  letter-spacing:-2px;
  margin-bottom:14px;
}

p{
  font-size:24px;
  opacity:.82;
}
</style>
</head>

<body>

<div class="container">
  <img src="logo.png" class="logo" alt="Aentigo Logo">
  <h1>Aentigo</h1>
  <p>Coming Soon</p>
</div>

</body>
</html>
