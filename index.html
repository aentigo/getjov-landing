<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aentigo</title>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  background:linear-gradient(180deg,#071b42 0%,#050914 100%);
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.container{
  padding:40px 30px;
}

.app-icon{
  width:72px;
  height:72px;
  border-radius:22px;
  margin:0 auto 22px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(20px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:900;
  color:#22D3EE;
  border:1px solid rgba(34,211,238,0.25);
}

h1{
  font-size:58px;
  font-weight:800;
  letter-spacing:-2px;
  margin-bottom:14px;
}

p{
  font-size:22px;
  opacity:.82;
}

.subtitle{
  margin-top:10px;
  font-size:16px;
  opacity:.55;
}
</style>
</head>

<body>

<div class="container">

  <div class="app-icon">A</div>

  <h1>Aentigo</h1>

  <p>Coming Soon</p>

  <div class="subtitle">
    Instant Jobs & Available Services
  </div>

</div>

</body>
</html>
